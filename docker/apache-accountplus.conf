LoadModule rewrite_module modules/mod_rewrite.so

ServerName accountplus
DocumentRoot /var/www/html

<Directory /var/www/html>
    Options -Indexes +FollowSymLinks
    AllowOverride All
    Require all granted
</Directory>

ServerTokens Prod
ServerSignature Off
TraceEnable Off

<Directory /var/www/html/app>
    AllowOverride None
    Require all denied
</Directory>
<Directory /var/www/html/assets>
    AllowOverride None
    <FilesMatch "(?i)\.(php[0-9]?|phtml|phar|cgi|pl)$">
        Require all denied
    </FilesMatch>
</Directory>

# Do not log query strings, referrers, cookies or submitted secrets.
LogFormat "%h %l %u %t \"%m %U %H\" %>s %b" accountplus
CustomLog "|/bin/cat" accountplus
ErrorLog "|/bin/cat"
